name: Upstream Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/flipacross/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Configure upstream remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/abuzuhri/Amazon-SP-API-CSharp.git
          git fetch upstream

      - name: Merge upstream into sync branch
        id: merge_upstream
        shell: bash
        run: |
          BRANCH_NAME="sync/upstream-$(date +%Y-%m-%d)"
          git checkout -B "$BRANCH_NAME" origin/main
          if ! git merge upstream/main --no-edit; then
            PROJECT_FILE="Source/FikaAmazonAPI/FikaAmazonAPI.csproj"

            if git diff --name-only --diff-filter=U | grep -qx "$PROJECT_FILE"; then
              python3 <<'PY'
          import re
          import subprocess
          from pathlib import Path

          project_file = "Source/FikaAmazonAPI/FikaAmazonAPI.csproj"
          upstream = subprocess.check_output(
              ["git", "show", f":3:{project_file}"],
              text=True,
          )

          version_lines = [
              line for line in upstream.splitlines()
              if re.match(r"\s*<(Version|VersionPrefix|AssemblyVersion|FileVersion)>", line)
          ]

          if not version_lines:
              raise SystemExit("Could not find upstream version properties.")

          path = Path(project_file)
          content = path.read_text()
          content, replacements = re.subn(
              r"(?ms)^<<<<<<< .+?\n.*?^=======\n.*?^>>>>>>> .+?\n",
              "\n".join(version_lines) + "\n",
              content,
              count=1,
          )

          if replacements != 1:
              raise SystemExit("Could not resolve project version conflict.")

          path.write_text(content)
          PY
              git add "$PROJECT_FILE"
            fi

            REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING_CONFLICTS" ]; then
              echo "Unresolved merge conflicts remain:"
              echo "$REMAINING_CONFLICTS"
              exit 1
            fi

            git commit --no-edit
          fi
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$COMMITS_AHEAD" -eq 0 ] || git diff --quiet origin/main..HEAD; then
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            echo "No upstream changes to sync."
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
            echo "Found $COMMITS_AHEAD commit(s) to sync."
          fi

      - name: Build merged branch
        if: env.HAS_CHANGES == 'true'
        run: dotnet build ./Source/FikaAmazonAPI/FikaAmazonAPI.csproj --configuration Release

      - name: Push sync branch
        if: env.HAS_CHANGES == 'true'
        run: git push --force-with-lease origin "HEAD:${{ env.BRANCH_NAME }}"

      - name: Create or reuse pull request
        if: env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git ls-remote --exit-code --heads origin "${{ env.BRANCH_NAME }}" >/dev/null

          HEAD_REF="${GITHUB_REPOSITORY_OWNER}:${{ env.BRANCH_NAME }}"
          EXISTING_PR_URL=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f head="$HEAD_REF" \
            -f base="main" \
            -f state="open" \
            --jq '.[0].html_url // ""')
          if [ -n "$EXISTING_PR_URL" ]; then
            echo "Pull request already exists: $EXISTING_PR_URL"
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base="main" \
            -f head="$HEAD_REF" \
            -f title="chore: sync upstream Amazon-SP-API-CSharp" \
            -f body="$(cat <<'EOF'
          ## Summary
          - merge latest changes from `abuzuhri/Amazon-SP-API-CSharp`
          - preserve FlipAcross fork customizations
          - validate merged branch with a Release build

          ## Test plan
          - [x] `dotnet build ./Source/FikaAmazonAPI/FikaAmazonAPI.csproj --configuration Release`
          EOF
          )"
